<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>

    <title>Form sinh viên JSF</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #34495e;
        }

        .form-input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-input:focus {
            border-color: #3498db;
            outline: none;
        }

        .error {
            display: block;
            color: #dc3545;
            margin-top: 5px;
            font-size: 13px;
        }

        .success {
            display: block;
            color: #155724;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .btn-save {
            background-color: #198754;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }

        .btn-save:hover {
            background-color: #146c43;
        }

        .btn-list {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .btn-list:hover {
            background-color: #1f2d3a;
        }

    </style>

</h:head>

<h:body>

    <div class="container">

        <h2>
            #{sinhVienBean.editMode
                ? 'Cập nhật sinh viên'
                : 'Thêm sinh viên'}
        </h2>

        <h:messages globalOnly="true"
                    styleClass="success" />

        <h:form>

            <!-- MÃ SINH VIÊN -->
            <div class="form-group">

                <h:outputLabel
                        for="ma"
                        value="Mã sinh viên"
                        styleClass="form-label" />

                <h:inputText
                        id="ma"
                        value="#{sinhVienBean.sinhVien.maSinhVien}"
                        required="true"
                        requiredMessage="Mã sinh viên bắt buộc nhập"
                        styleClass="form-input" />

                <h:message
                        for="ma"
                        styleClass="error" />

            </div>


            <!-- HỌ TÊN -->
            <div class="form-group">

                <h:outputLabel
                        for="hoten"
                        value="Họ tên"
                        styleClass="form-label" />

                <h:inputText
                        id="hoten"
                        value="#{sinhVienBean.sinhVien.hoTen}"
                        required="true"
                        requiredMessage="Họ tên bắt buộc nhập"
                        styleClass="form-input" />

                <h:message
                        for="hoten"
                        styleClass="error" />

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <h:outputLabel
                        for="email"
                        value="Email"
                        styleClass="form-label" />

                <h:inputText
                        id="email"
                        value="#{sinhVienBean.sinhVien.email}"
                        styleClass="form-input" />

                <h:message
                        for="email"
                        styleClass="error" />

            </div>


            <!-- LỚP -->
            <div class="form-group">

                <h:outputLabel
                        for="lop"
                        value="Lớp"
                        styleClass="form-label" />

                <h:selectOneMenu
                        id="lop"
                        value="#{sinhVienBean.sinhVien.lop}"
                        required="true"
                        requiredMessage="Vui lòng chọn lớp"
                        styleClass="form-input">

                    <f:selectItem
                            itemLabel="-- Chọn lớp --"
                            itemValue=""
                            noSelectionOption="true" />

                    <f:selectItem
                            itemLabel="DCCNTT15.10.1"
                            itemValue="DCCNTT15.10.1" />

                    <f:selectItem
                            itemLabel="DCCNTT15.10.2"
                            itemValue="DCCNTT15.10.2" />

                    <f:selectItem
                            itemLabel="DCCNTT15.10.3"
                            itemValue="DCCNTT15.10.3" />

                </h:selectOneMenu>

                <h:message
                        for="lop"
                        styleClass="error" />

            </div>


            <!-- NÚT LƯU / CẬP NHẬT -->
            <h:commandButton
                    value="#{sinhVienBean.editMode
                        ? 'Cập nhật sinh viên'
                        : 'Lưu sinh viên'}"
                    action="#{sinhVienBean.save}"
                    styleClass="btn-save" />

        </h:form>


        <!-- QUAY LẠI DANH SÁCH -->
        <h:link
                outcome="sinhvien-list"
                value="Xem danh sách sinh viên"
                styleClass="btn-list" />

    </div>

</h:body>

</html>
